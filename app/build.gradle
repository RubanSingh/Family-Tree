plugins {
	alias(libs.plugins.android.application)
	alias(libs.plugins.google.services)
	alias(libs.plugins.firebase.crashlytics)
	alias(libs.plugins.firebase.perf)
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
	keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
	namespace = 'dna.familytree'
	compileSdk = libs.versions.compileSdk.get().toInteger()
	defaultConfig {
		applicationId = "dna.familytree"
		minSdk = libs.versions.minSdk.get().toInteger()
		targetSdk = libs.versions.targetSdk.get().toInteger()
		versionCode = 6
		versionName = '1.5'
		vectorDrawables.useSupportLibrary = true
		// Defaults to Google's sample AdMob app ID
		manifestPlaceholders = [admobAppId: keystoreProps.getProperty('admobAppId', 'ca-app-pub-3940256099942544~3347511713')]

		testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
	}

	androidResources {
		localeFilters += ['ar', 'ckb', 'cs', 'da', 'de', 'en', 'eo', 'es', 'fa', 'fr', 'hr', 'hu', 'in', 'it', 'iw', 'kn', 'mr', 'nb', 'nl', 'pl', 'pt', 'ru', 'sk', 'sl', 'sr', 'ti', 'tr', 'uk', 'zh']
	}

	// Release signing and AdMob IDs are read from keystore.properties (git-ignored, see keystore.properties.example).
	// Without it, release builds are signed with the debug key and all builds use Google's sample ad IDs.
	signingConfigs {
		if (keystoreProps.getProperty('storeFile')) {
			release {
				storeFile = rootProject.file(keystoreProps.getProperty('storeFile'))
				storePassword = keystoreProps.getProperty('storePassword')
				keyAlias = keystoreProps.getProperty('keyAlias')
				keyPassword = keystoreProps.getProperty('keyPassword')
			}
		}
	}

	buildFeatures {
		dataBinding = true
		buildConfig = true
	}

	buildTypes {
		debug {
			pseudoLocalesEnabled = true
			// Google's sample ad units: real ads requested by debug builds would count as invalid traffic
			buildConfigField 'String', 'AD_UNIT_NATIVE', '"ca-app-pub-3940256099942544/2247696110"'
			buildConfigField 'String', 'AD_UNIT_INTERSTITIAL', '"ca-app-pub-3940256099942544/1033173712"'
			buildConfigField 'String', 'AD_UNIT_REWARDED', '"ca-app-pub-3940256099942544/5224354917"'
		}
		release {
			buildConfigField 'String', 'AD_UNIT_NATIVE', "\"${keystoreProps.getProperty('adUnitNative', 'ca-app-pub-3940256099942544/2247696110')}\""
			buildConfigField 'String', 'AD_UNIT_INTERSTITIAL', "\"${keystoreProps.getProperty('adUnitInterstitial', 'ca-app-pub-3940256099942544/1033173712')}\""
			buildConfigField 'String', 'AD_UNIT_REWARDED', "\"${keystoreProps.getProperty('adUnitRewarded', 'ca-app-pub-3940256099942544/5224354917')}\""
			shrinkResources = true
			minifyEnabled = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig = signingConfigs.findByName('release') ?: signingConfigs.debug
		}
	}
	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
		// java.time & co. on API 24-25, needed by newer commons-net and jsoup
		coreLibraryDesugaringEnabled = true
	}
	packaging {
		resources {
			excludes += ['**/*.properties', 'META-INF/*.md', 'META-INF/*.xml']
			pickFirsts += ['EventFact*.properties']
		}
	}
}

dependencies {
	coreLibraryDesugaring libs.desugar.jdk.libs

	implementation files('libs/gedcom-1.15.0.jar') // Maven Central release; adds AGE of events and spouses (data format unchanged)
	implementation files('libs/gedcomgraph-3.14.jar') // From Family Gem 1.3; lays out RTL itself
	implementation files('libs/geonames-1.1.14.jar')
	implementation files('libs/slf4j-api-1.7.25.jar')
	implementation project(':cropper')
	implementation project(':core:designsystem')
	implementation project(':core:billing')

	implementation libs.androidx.activity
	implementation libs.androidx.appcompat
	implementation libs.androidx.core
	implementation libs.androidx.lifecycle.process
	implementation libs.androidx.navigation.fragment.ktx
	implementation libs.androidx.palette
	implementation libs.androidx.work.runtime

	implementation libs.google.billing
	implementation libs.google.flexbox
	implementation libs.google.installreferrer
	implementation libs.google.play.app.update
	implementation libs.google.material
	implementation libs.google.play.services.ads
	implementation libs.google.ump // GDPR / US states consent before any ad request

	implementation platform(libs.firebase.bom)
	implementation libs.firebase.analytics
	implementation libs.firebase.crashlytics
	implementation libs.firebase.messaging
	implementation libs.firebase.perf

	implementation libs.airbnb.lottie
	implementation libs.apache.commons.io
	implementation libs.apache.commons.net
	implementation libs.fastscroller.recyclerview.fixes
	implementation libs.google.gson
	implementation libs.google.guava
	implementation libs.jdom
	implementation libs.joda.time
	implementation libs.jsoup
	implementation libs.otaliastudios.zoomlayout
	implementation libs.squareup.picasso
	implementation libs.wasabeef.picasso.transformations

	testImplementation libs.junit
}
