[versions]
# SDK levels, shared by all modules
compileSdk = "37"
minSdk = "24"
targetSdk = "37"

# Build tools and plugins
agp = "9.4.1"
kotlin = "2.4.21"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebasePerfPlugin = "2.0.2"
desugarJdkLibs = "2.1.5"

# AndroidX
activity = "1.13.0"
appcompat = "1.8.0"
core = "1.19.1"
exifinterface = "1.4.2"
lifecycle = "2.11.0"
navigation = "2.10.2"
palette = "1.0.0"
work = "2.12.0"

# Google
billing = "9.1.0"
firebaseBom = "35.0.2"
flexbox = "3.0.0"
installreferrer = "2.2"
material = "1.14.0"
playServicesAds = "25.5.0"
playAppUpdate = "2.1.0"
ump = "4.0.0"

# Third party
commonsIo = "2.8.0" # 2.9.0+ use java.nio.file, which needs API 26
commonsNet = "3.13.0"
fastScrollerAndRecyclerViewFixes = "9"
gson = "2.14.0"
guava = "33.7.2-android"
jdom = "1.1.3" # Don't update to version 2.x for compatibility with GeoNames
jodaTime = "2.15.0"
jsoup = "1.23.2"
junit = "4.13.2"
lottie = "6.7.1"
picasso = "2.8"
picassoTransformations = "2.4.0"
zoomlayout = "1.9.0"

[libraries]
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

google-billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
google-flexbox = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexbox" }
google-play-app-update = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "playAppUpdate" }
google-installreferrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "installreferrer" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
google-play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
google-ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }

airbnb-lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
apache-commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsIo" }
apache-commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
fastscroller-recyclerview-fixes = { group = "com.github.AndroidDeveloperLB", name = "FastScrollerAndRecyclerViewFixes", version.ref = "fastScrollerAndRecyclerViewFixes" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
google-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
jdom = { group = "org.jdom", name = "jdom", version.ref = "jdom" }
joda-time = { group = "joda-time", name = "joda-time", version.ref = "jodaTime" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
otaliastudios-zoomlayout = { group = "com.otaliastudios", name = "zoomlayout", version.ref = "zoomlayout" }
squareup-picasso = { group = "com.squareup.picasso", name = "picasso", version.ref = "picasso" }
wasabeef-picasso-transformations = { group = "jp.wasabeef", name = "picasso-transformations", version.ref = "picassoTransformations" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerfPlugin" }
